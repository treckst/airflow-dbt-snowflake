snapshots:
  - name: golden_items
    relation: ref('dim_stock')
    config:
      schema: gold
      database: stocks
      unique_key: id
      strategy: check
      check_cols: ['symbol', 'name', 'exchange_name', 'exchange_code']
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`.